<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול תאריכי חתונות - דעת אהרן</title>
    <!-- שימוש בפונט Assistant של Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #c89d7c; /* גוון שמפניה / רוז גולד עדין מהלוגו */
            --primary-hover: #802030; /* גוון בורדו חם */
            --logo-burgundy: #4a121a; /* גוון הבורדו הכהה והמדויק של הלוגו */
            --bg-color: #f5f6fa;
            --card-bg: rgba(255, 255, 255, 0.94); /* רקע חצי שקוף לקריאות טובה */
            --text-color: #2f3640;
            --border-color: rgba(220, 221, 225, 0.6);
            --danger-color: #e84118;
            --danger-hover: #c23616;
            --excel-color: #27ae60;
            --excel-hover: #219653;
            --sync-color: #2980b9;
            --sync-hover: #1f618d;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background: radial-gradient(circle at 15% 15%, rgba(227, 242, 253, 0.75) 0%, transparent 55%),
                        radial-gradient(circle at 85% 85%, rgba(247, 235, 218, 0.8) 0%, transparent 55%),
                        linear-gradient(135deg, #f2f6fa 0%, #fbf9f6 50%, #f7edd9 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.85);
            padding: 25px 20px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .header-logo {
            max-height: 130px;
            width: auto;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        header h1 {
            color: var(--logo-burgundy);
            margin: 0 0 5px 0;
            font-weight: 700;
            font-size: 1.8rem;
        }

        header p {
            color: #57606f;
            margin: 0;
            font-size: 1.1rem;
        }

        .form-section, .list-section {
            background-color: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .section-title {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.25rem;
            color: var(--logo-burgundy);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 8px;
            display: inline-block;
            font-weight: 700;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        @media (max-width: 600px) {
            form {
                grid-template-columns: 1fr;
            }
        }

        .form-group label {
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--logo-burgundy);
        }

        .form-group input {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: rgba(255, 255, 255, 0.8);
        }

        .form-group input:focus {
            border-color: var(--logo-burgundy);
            box-shadow: 0 0 5px rgba(74, 18, 26, 0.2);
        }

        .form-actions {
            grid-column: span 2;
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .form-actions {
                grid-column: span 1;
                flex-direction: column;
                gap: 10px;
            }
        }

        .btn-submit, .btn-cancel {
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
            border: none;
            font-family: inherit;
        }

        .btn-submit {
            background-color: var(--logo-burgundy);
            color: white;
            flex: 2;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-cancel {
            background-color: #718093;
            color: white;
            flex: 1;
        }

        .btn-cancel:hover {
            background-color: #57606f;
        }

        .search-container {
            margin-bottom: 15px;
        }

        .search-container input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: rgba(255, 255, 255, 0.9);
        }

        .search-container input:focus {
            border-color: var(--logo-burgundy);
            box-shadow: 0 0 8px rgba(74, 18, 26, 0.15);
        }

        .data-management-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn-data {
            background-color: transparent;
            border: 1px solid var(--logo-burgundy);
            color: var(--logo-burgundy);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-data:hover {
            background-color: var(--logo-burgundy);
            color: white;
        }

        .btn-excel {
            border-color: var(--excel-color);
            color: var(--excel-color);
        }

        .btn-excel:hover {
            background-color: var(--excel-color);
            color: white;
        }

        .btn-sync {
            border-color: var(--sync-color);
            color: var(--sync-color);
        }

        .btn-sync:hover {
            background-color: var(--sync-color);
            color: white;
        }

        .status-badge {
            font-size: 0.85rem;
            color: #57606f;
            margin-right: auto;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(248, 249, 250, 0.7);
            font-weight: 600;
            color: var(--logo-burgundy);
        }

        tr:hover {
            background-color: rgba(240, 240, 240, 0.4);
        }

        .actions-cell {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            transition: background-color 0.2s;
            color: white;
        }

        .btn-edit {
            background-color: var(--logo-burgundy);
        }

        .btn-edit:hover {
            background-color: var(--primary-hover);
        }

        .btn-delete {
            background-color: var(--danger-color);
        }

        .btn-delete:hover {
            background-color: var(--danger-hover);
        }

        .no-data {
            text-align: center;
            color: #718093;
            padding: 30px;
            font-style: italic;
        }
        
        .loading-text {
            font-size: 0.85rem;
            color: var(--logo-burgundy);
            margin-top: 4px;
            font-weight: 600;
            min-height: 1.2rem;
            transition: color 0.2s;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <img src="./index_files/logo.png" alt="לוגו דעת אהרן" class="header-logo" onerror="this.style.display='none';">
            <h1>רשימת תאריכי חתונות</h1>
            <p>ישיבת דעת אהרן - מערכת אישית לניהול ומעקב אחר מועדי חתונות</p>
        </header>

        <main>
            <!-- אזור הטבלה - מוצג ראשון -->
            <section class="list-section" id="listSection">
                <h2 class="section-title">חתונות שמורות ברשימה</h2>
                
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="🔍 חפש ברשימה (לפי חתן, ועד, אולם, כתובת, יום או תאריך)...">
                </div>

                <div class="data-management-actions">
                    <button id="syncGithubBtn" class="btn-data btn-sync">🔄 סנכרן מ-GitHub</button>
                    <button id="exportExcelBtn" class="btn-data btn-excel">📊 ייצוא לאקסל (Excel)</button>
                    <button id="exportBtn" class="btn-data">📥 גיבוי רשימה (JSON)</button>
                    <button id="importBtn" class="btn-data">📤 טעינת גיבוי מקומי</button>
                    <input type="file" id="importFileInput" style="display: none;" accept=".json">
                    <span id="syncStatus" class="status-badge"></span>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>שם החתן</th>
                                <th>ועד</th>
                                <th>שם האולם</th>
                                <th>כתובת</th>
                                <th>יום בשבוע</th>
                                <th>תאריך לועזי</th>
                                <th>תאריך עברי</th>
                                <th>פעולות</th>
                            </tr>
                        </thead>
                        <tbody id="weddingList">
                            <!-- הנתונים יוזנו כאן אוטומטית -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- אזור הטופס - מוצג שני -->
            <section class="form-section" id="formSection">
                <h2 class="section-title" id="formSectionTitle">הוספת חתונה חדשה</h2>
                <form id="weddingForm">
                    <div class="form-group">
                        <label for="groomName">שם החתן:</label>
                        <input type="text" id="groomName" required="" placeholder="הזן את שם החתן">
                    </div>

                    <div class="form-group">
                        <label for="committee">ועד:</label>
                        <input type="text" id="committee" required="" placeholder="לדוגמה: ועד חמישי / א">
                    </div>
                    
                    <div class="form-group">
                        <label for="gregorianDate">תאריך לועזי:</label>
                        <input type="date" id="gregorianDate" required="">
                    </div>

                    <div class="form-group">
                        <label for="hebrewDate">תאריך עברי:</label>
                        <input type="text" id="hebrewDate" required="" placeholder="לדוגמה: כ״ז באב תשפ״ו">
                        <div id="loadingHebrew" class="loading-text"></div>
                    </div>

                    <div class="form-group">
                        <label for="venueName">שם האולם:</label>
                        <input type="text" id="venueName" required="" placeholder="אולם, גן אירועים">
                    </div>

                    <div class="form-group">
                        <label for="address">כתובת:</label>
                        <input type="text" id="address" required="" placeholder="עיר, רחוב ומספר">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-submit" id="submitBtn">שמור חתונה ברשימה</button>
                        <button type="button" class="btn-cancel" id="cancelEditBtn" style="display: none;">ביטול עריכה</button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // כתובות הגיבוי ב-GitHub (בודק main ואם לא קיים מנסה master)
            const GITHUB_URLS = [
                'https://raw.githubusercontent.com/e0548509872-ops/Daat-Aharon-Weddings/main/wedding_dates_backup.json',
                'https://raw.githubusercontent.com/e0548509872-ops/Daat-Aharon-Weddings/master/wedding_dates_backup.json'
            ];

            const form = document.getElementById('weddingForm');
            const listContainer = document.getElementById('weddingList');
            const gregorianDateInput = document.getElementById('gregorianDate');
            const hebrewDateInput = document.getElementById('hebrewDate');
            const loadingHebrew = document.getElementById('loadingHebrew');
            const searchInput = document.getElementById('searchInput');
            const syncStatus = document.getElementById('syncStatus');
            
            const formSectionTitle = document.getElementById('formSectionTitle');
            const submitBtn = document.getElementById('submitBtn');
            const cancelEditBtn = document.getElementById('cancelEditBtn');

            const exportBtn = document.getElementById('exportBtn');
            const exportExcelBtn = document.getElementById('exportExcelBtn');
            const importBtn = document.getElementById('importBtn');
            const importFileInput = document.getElementById('importFileInput');
            const syncGithubBtn = document.getElementById('syncGithubBtn');

            // קבלת התאריך הנוכחי בפורמט YYYY-MM-DD לפי הזמן המקומי
            function getTodayDateString() {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            const todayStr = getTodayDateString();
            gregorianDateInput.min = todayStr;

            const dateCache = {
                g2h: {},
                h2g: {}
            };

            // טעינת רשימת החתונות מה-LocalStorage (כגיבוי מקומי ראשוני)
            let weddings = [];
            try {
                weddings = JSON.parse(localStorage.getItem('weddings')) || [];
            } catch (e) {
                console.error("שגיאה בטעינת נתונים מ-localStorage", e);
                weddings = [];
            }

            // מחיקה אוטומטית של חתונות שעברו
            function removePastWeddings() {
                const currentToday = getTodayDateString();
                const initialCount = weddings.length;
                
                weddings = weddings.filter(w => {
                    if (!w.gregorianDate) return false;
                    return w.gregorianDate >= currentToday;
                });

                if (weddings.length !== initialCount) {
                    saveWeddings();
                }
            }

            function ensureIds() {
                let needsSave = false;
                weddings = weddings.map(w => {
                    if (!w.id) {
                        w.id = 'w_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
                        needsSave = true;
                    }
                    return w;
                });
                if (needsSave) saveWeddings();
            }

            function sortWeddings() {
                weddings.sort((a, b) => {
                    const dateA = a.gregorianDate ? new Date(a.gregorianDate).getTime() : 0;
                    const dateB = b.gregorianDate ? new Date(b.gregorianDate).getTime() : 0;
                    if (isNaN(dateA)) return 1;
                    if (isNaN(dateB)) return -1;
                    return dateA - dateB;
                });
            }

            function saveWeddings() {
                localStorage.setItem('weddings', JSON.stringify(weddings));
            }

            function updateUI() {
                removePastWeddings();
                ensureIds();
                sortWeddings();
                renderWeddings(searchInput.value.trim());
            }

            // טעינה וסנכרון מ-GitHub
            async function fetchFromGitHub(showFeedback = false) {
                if (showFeedback) syncStatus.textContent = '🔄 מסנכרן מ-GitHub...';
                
                let success = false;
                for (const baseUrl of GITHUB_URLS) {
                    try {
                        // הוספת מזהה ייחודי כדי למנוע שמירת זיכרון מטמון ישן (cache-busting)
                        const fetchUrl = `${baseUrl}?t=${Date.now()}`;
                        const response = await fetch(fetchUrl);
                        
                        if (response.ok) {
                            const data = await response.json();
                            if (Array.isArray(data)) {
                                weddings = data.map(item => ({
                                    ...item,
                                    id: item.id || ('w_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now())
                                }));
                                
                                updateUI();
                                saveWeddings();
                                syncStatus.textContent = '✅ סונכרן מ-GitHub';
                                syncStatus.style.color = '#27ae60';
                                success = true;
                                break;
                            }
                        }
                    } catch (err) {
                        console.warn('ניסיון סנכרון נכשל מכתובת:', baseUrl, err);
                    }
                }

                if (!success) {
                    if (showFeedback) {
                        alert('לא ניתן לסנכרן כעת מ-GitHub. מוצגים הנתונים המקומיים השמורים.');
                    }
                    syncStatus.textContent = '⚠️ מצב מקומי (ללא סנכרון)';
                    syncStatus.style.color = '#e67e22';
                }
            }

            // טעינה מקומית ראשונית כדי שהמשתמש לא ימתין
            updateUI();
            
            // סנכרון אוטומטי מ-GitHub עם טעינת הדף
            fetchFromGitHub(false);

            // כפתור סנכרון ידני
            syncGithubBtn.addEventListener('click', () => {
                fetchFromGitHub(true);
            });

            let editId = null;

            function formatDate(dateString) {
                if (!dateString) return '';
                const parts = dateString.split('-');
                if (parts.length < 3) return dateString;
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }

            function getDayOfWeek(dateString) {
                if (!dateString) return '';
                const parts = dateString.split('-');
                if (parts.length < 3) return '';
                const year = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10) - 1;
                const day = parseInt(parts[2], 10);
                
                const date = new Date(year, month, day);
                if (isNaN(date.getTime())) return '';
                
                const days = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
                return 'יום ' + days[date.getDay()];
            }

            function escapeHtml(text) {
                if (!text) return '';
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, m => map[m]);
            }

            function renderWeddings(filterText = '') {
                listContainer.innerHTML = '';
                
                const filteredWeddings = weddings.filter(wedding => {
                    const groom = (wedding.groomName || '').toLowerCase();
                    const committee = (wedding.committee || '').toLowerCase();
                    const venue = (wedding.venueName || wedding.location || '').toLowerCase();
                    const address = (wedding.address || '').toLowerCase();
                    const hebrew = (wedding.hebrewDate || '').toLowerCase();
                    const dayOfWeek = getDayOfWeek(wedding.gregorianDate).toLowerCase();
                    const searchLower = filterText.toLowerCase();

                    return groom.includes(searchLower) || 
                           committee.includes(searchLower) || 
                           venue.includes(searchLower) || 
                           address.includes(searchLower) || 
                           hebrew.includes(searchLower) ||
                           dayOfWeek.includes(searchLower);
                });
                
                if (filteredWeddings.length === 0) {
                    const message = filterText 
                        ? 'לא נמצאו חתונות התואמות לחיפוש הנוכחי.' 
                        : 'אין עדיין חתונות עתידיות ברשימה.';
                    listContainer.innerHTML = `<tr><td colspan="8" class="no-data">${message}</td></tr>`;
                    return;
                }

                filteredWeddings.forEach((wedding) => {
                    const tr = document.createElement('tr');
                    
                    const searchQuery = encodeURIComponent(`${wedding.venueName || ''} ${wedding.address || ''}`.trim());
                    const addressCell = wedding.address 
                        ? `<a href="https://www.google.com/maps/search/?api=1&query=${searchQuery}" target="_blank" style="color: var(--logo-burgundy); text-decoration: underline; display: inline-flex; align-items: center; gap: 4px;" title="ניווט בגוגל מפות">
                            <span>${escapeHtml(wedding.address)}</span>
                            <span style="font-size: 0.95rem;">📍</span>
                           </a>` 
                        : '';

                    const dayOfWeek = getDayOfWeek(wedding.gregorianDate);

                    tr.innerHTML = `
                        <td><strong>${escapeHtml(wedding.groomName)}</strong></td>
                        <td>${escapeHtml(wedding.committee || '')}</td>
                        <td>${escapeHtml(wedding.venueName || wedding.location || '')}</td>
                        <td>${addressCell}</td>
                        <td>${escapeHtml(dayOfWeek)}</td>
                        <td>${formatDate(wedding.gregorianDate)}</td>
                        <td>${escapeHtml(wedding.hebrewDate)}</td>
                        <td class="actions-cell">
                            <button class="btn-action btn-edit" data-id="${wedding.id}">ערוך</button>
                            <button class="btn-action btn-delete" data-id="${wedding.id}">מחק</button>
                        </td>
                    `;
                    listContainer.appendChild(tr);
                });
            }

            listContainer.addEventListener('click', (e) => {
                const editBtn = e.target.closest('.btn-edit');
                const deleteBtn = e.target.closest('.btn-delete');
                
                if (editBtn) {
                    const id = editBtn.getAttribute('data-id');
                    startEdit(id);
                } else if (deleteBtn) {
                    const id = deleteBtn.getAttribute('data-id');
                    deleteWedding(id);
                }
            });

            function startEdit(id) {
                editId = id;
                const wedding = weddings.find(w => w.id === id);
                if (!wedding) return;

                setLoadingState(false);

                document.getElementById('groomName').value = wedding.groomName;
                document.getElementById('committee').value = wedding.committee || '';
                document.getElementById('venueName').value = wedding.venueName || wedding.location || '';
                document.getElementById('address').value = wedding.address || '';
                gregorianDateInput.value = wedding.gregorianDate;
                hebrewDateInput.value = wedding.hebrewDate;

                formSectionTitle.textContent = 'עריכת פרטי חתונה';
                submitBtn.textContent = 'עדכן חתונה ברשימה';
                cancelEditBtn.style.display = 'inline-block';

                document.getElementById('formSection').scrollIntoView({ behavior: 'smooth' });
            }

            function cancelEdit() {
                editId = null;
                form.reset();
                formSectionTitle.textContent = 'הוספת חתונה חדשה';
                submitBtn.textContent = 'שמור חתונה ברשימה';
                cancelEditBtn.style.display = 'none';
                setLoadingState(false);
            }

            function deleteWedding(id) {
                if (confirm('האם אתה בטוח שברצונך למחוק חתונה זו מהרשימה?')) {
                    if (editId === id) {
                        cancelEdit();
                    }
                    weddings = weddings.filter(w => w.id !== id);
                    saveWeddings();
                    renderWeddings(searchInput.value.trim());
                }
            }

            // ==========================================
            //      מנגנון המרת תאריכים עברי-לועזי
            // ==========================================
            function cleanHebrewString(str) {
                if (!str) return '';
                return str.replace(/[\u0591-\u05C7]/g, '').replace(/[״׳"']/g, '').trim();
            }

            function hebrewToNumber(str) {
                const values = {
                    'א': 1, 'ב': 2, 'ג': 3, 'ד': 4, 'ה': 5, 'ו': 6, 'ז': 7, 'ח': 8, 'ט': 9, 'י': 10,
                    'כ': 20, 'ל': 30, 'מ': 40, 'נ': 50, 'ס': 60, 'ע': 70, 'פ': 80, 'צ': 90, 'ק': 100,
                    'ר': 200, 'ש': 300, 'ת': 400, 'ך': 20, 'ם': 40, 'ן': 50, 'ף': 80, 'ץ': 90
                };
                let sum = 0;
                const cleanStr = cleanHebrewString(str);
                for (let char of cleanStr) {
                    if (values[char]) sum += values[char];
                }
                return sum;
            }

            const hebrewMonthsMap = {
                'תשרי': 'Tishrei', 'חשון': 'Cheshvan', 'חשוון': 'Cheshvan', 'מרחשון': 'Cheshvan', 'מרחשוון': 'Cheshvan',
                'כסלו': 'Kislev', 'כסליו': 'Kislev', 'טבת': 'Tevet', 'שבט': 'Sh\'vat',
                'אדר': 'Adar', 'אדר א': 'Adar1', 'אדר ראשון': 'Adar1',
                'אדר ב': 'Adar2', 'אדר שני': 'Adar2',
                'ניסן': 'Nisan', 'אייר': 'Iyyar', 'סיון': 'Sivan', 'סיוון': 'Sivan',
                'תמוז': 'Tamuz', 'אב': 'Av', 'מנחם אב': 'Av', 'אלול': 'Elul'
            };

            function parseHebrewMonth(word) {
                const cleanWord = cleanHebrewString(word);
                if (hebrewMonthsMap[cleanWord]) return hebrewMonthsMap[cleanWord];
                if (cleanWord.startsWith('ב')) {
                    const sliced = cleanWord.slice(1);
                    if (hebrewMonthsMap[sliced]) return hebrewMonthsMap[sliced];
                }
                return null;
            }

            function parseHebrewDateString(str) {
                const ignoredWords = ["שנת", "בשנת"];
                const parts = str.trim().split(/\s+/).filter(p => !ignoredWords.includes(cleanHebrewString(p)));
                if (parts.length < 3) return null;

                let dayStr = parts[0];
                let monthStr = parts[1];
                let yearStr = parts[2];

                if (parts.length >= 4) {
                    const combinedMonth = parts[1] + " " + parts[2];
                    const parsedCombined = parseHebrewMonth(combinedMonth);
                    if (parsedCombined) {
                        monthStr = combinedMonth;
                        yearStr = parts[3];
                    }
                }

                let day;
                const cleanDay = cleanHebrewString(dayStr);
                if (/^\d+$/.test(cleanDay)) day = parseInt(cleanDay, 10);
                else day = hebrewToNumber(cleanDay);

                const month = parseHebrewMonth(monthStr);

                let year;
                let cleanYear = cleanHebrewString(yearStr);
                if (/^\d+$/.test(cleanYear)) {
                    year = parseInt(cleanYear, 10);
                } else {
                    if (cleanYear.startsWith('ה') && cleanYear.length > 3 && (cleanYear.startsWith('הת') || cleanYear.startsWith('הש'))) {
                        cleanYear = cleanYear.slice(1);
                    }
                    year = hebrewToNumber(cleanYear);
                    if (year < 1000) year += 5000;
                }

                if (day > 0 && day <= 30 && month && year > 5000 && year < 6000) {
                    return { day, month, year };
                }
                return null;
            }

            function setLoadingState(isLoading, message = '', isError = false) {
                loadingHebrew.textContent = message;
                if (message) {
                    loadingHebrew.style.color = isError ? 'var(--danger-color)' : 'var(--logo-burgundy)';
                }
                submitBtn.disabled = isLoading;
                if (isLoading) {
                    submitBtn.style.opacity = '0.6';
                    submitBtn.style.cursor = 'not-allowed';
                } else {
                    submitBtn.style.opacity = '1';
                    submitBtn.style.cursor = 'pointer';
                }
            }

            async function fetchGregorianDate(hebrewDateStr) {
                const parsed = parseHebrewDateString(hebrewDateStr);
                if (!parsed) return null;
                
                const cacheKey = `${parsed.day}_${parsed.month}_${parsed.year}`;
                if (dateCache.h2g[cacheKey]) return dateCache.h2g[cacheKey];
                
                setLoadingState(true, 'מזהה תאריך עברי ומחשב לועזי...');
                try {
                    const response = await fetch(`https://www.hebcal.com/converter?cfg=json&hy=${parsed.year}&hm=${parsed.month}&hd=${parsed.day}&h2g=1`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.gy && data.gm && data.gd) {
                            const formattedMonth = String(data.gm).padStart(2, '0');
                            const formattedDay = String(data.gd).padStart(2, '0');
                            const result = `${data.gy}-${formattedMonth}-${formattedDay}`;
                            dateCache.h2g[cacheKey] = result;
                            return result;
                        }
                    }
                } catch (error) {
                    console.error('שגיאה בחיבור לשירות המרת תאריכים', error);
                } finally {
                    setLoadingState(false);
                }
                return null;
            }

            async function fetchHebrewDate(dateValue) {
                if (!dateValue) return;
                if (dateCache.g2h[dateValue]) {
                    hebrewDateInput.value = dateCache.g2h[dateValue];
                    setLoadingState(false);
                    return;
                }
                
                const [year, month, day] = dateValue.split('-');
                setLoadingState(true, 'מחשב תאריך עברי...');
                
                try {
                    const response = await fetch(`https://www.hebcal.com/converter?cfg=json&gy=${year}&gm=${month}&gd=${day}&g2h=1`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.hebrew) {
                            hebrewDateInput.value = data.hebrew;
                            dateCache.g2h[dateValue] = data.hebrew;
                        }
                    }
                } catch (error) {
                    console.error('שגיאה בחיבור לשירות המרת תאריכים', error);
                    setLoadingState(false, '⚠️ שגיאה בחיבור לרשת. ניתן להזין תאריך עברי ידנית.', true);
                } finally {
                    setLoadingState(false);
                }
            }

            gregorianDateInput.addEventListener('change', (e) => {
                fetchHebrewDate(e.target.value);
            });

            hebrewDateInput.addEventListener('change', async (e) => {
                const value = e.target.value.trim();
                if (!value) return;
                const gregDate = await fetchGregorianDate(value);
                if (gregDate) {
                    gregorianDateInput.value = gregDate;
                    setLoadingState(false, 'התאריך פוענח בהצלחה!', false);
                    loadingHebrew.style.color = 'green';
                } else {
                    setLoadingState(false, '⚠️ לא הצלחנו לפענח את התאריך העברי. אנא וודא שהפורמט תקין (למשל: כ״ז באב תשפ״ו)', true);
                }
            });

            // ==========================================
            //      ייצוא לאקסל (Excel)
            // ==========================================
            function exportToExcel() {
                if (weddings.length === 0) {
                    alert('אין נתונים לייצוא.');
                    return;
                }

                let excelContent = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head>
                    <meta http-equiv="content-type" content="text/plain; charset=UTF-8">
                    <!--[if gte mso 9]>
                    <xml>
                        <x:ExcelWorkbook>
                            <x:ExcelWorksheets>
                                <x:ExcelWorksheet>
                                    <x:Name>רשימת חתונות</x:Name>
                                    <x:WorksheetOptions>
                                        <x:DisplayRightToLeft/>
                                    </x:WorksheetOptions>
                                </x:ExcelWorksheet>
                            </x:ExcelWorksheets>
                        </x:ExcelWorkbook>
                    </xml>
                    <![endif]-->
                    <style>
                        table { border-collapse: collapse; direction: rtl; }
                        th, td { border: 1px solid #cccccc; padding: 8px; text-align: right; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
                        th { background-color: #4a121a; color: white; font-weight: bold; }
                    </style>
                </head>
                <body>
                    <table>
                        <thead>
                            <tr>
                                <th>שם החתן</th>
                                <th>ועד</th>
                                <th>שם האולם</th>
                                <th>כתובת</th>
                                <th>יום בשבוע</th>
                                <th>תאריך לועזי</th>
                                <th>תאריך עברי</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                weddings.forEach(w => {
                    const dayOfWeek = getDayOfWeek(w.gregorianDate);
                    excelContent += `
                        <tr>
                            <td><b>${escapeHtml(w.groomName)}</b></td>
                            <td>${escapeHtml(w.committee || '')}</td>
                            <td>${escapeHtml(w.venueName || w.location || '')}</td>
                            <td>${escapeHtml(w.address || '')}</td>
                            <td>${escapeHtml(dayOfWeek)}</td>
                            <td>${formatDate(w.gregorianDate)}</td>
                            <td>${escapeHtml(w.hebrewDate)}</td>
                        </tr>
                    `;
                });

                excelContent += `
                        </tbody>
                    </table>
                </body>
                </html>
                `;

                const blob = new Blob(['\uFEFF' + excelContent], { type: 'application/vnd.ms-excel;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const downloadAnchor = document.createElement('a');
                downloadAnchor.href = url;
                downloadAnchor.download = 'wedding_dates.xls';
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                document.body.removeChild(downloadAnchor);
                URL.revokeObjectURL(url);
            }

            exportExcelBtn.addEventListener('click', exportToExcel);

            // ==========================================
            //      ניהול קבצי גיבוי (JSON)
            // ==========================================
            exportBtn.addEventListener('click', () => {
                if (weddings.length === 0) {
                    alert('אין נתונים לייצוא.');
                    return;
                }
                const cleanWeddings = weddings.map(({ id, ...rest }) => rest);
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cleanWeddings, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", "wedding_dates_backup.json");
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
            });

            importBtn.addEventListener('click', () => {
                importFileInput.click();
            });

            importFileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (Array.isArray(imported)) {
                            if (confirm(`⚠️ אזהרה: טעינת הגיבוי תמחק את הרשימה הקיימת ותחליף אותה ב-${imported.length} חתונות מקובץ הגיבוי.\n(חתונות שעבר זמנן יוסרו אוטומטית)\n\nהאם ברצונך להמשיך?`)) {
                                weddings = [];
                                imported.forEach(newW => {
                                    if (!newW.groomName) return;
                                    newW.id = 'w_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
                                    weddings.push(newW);
                                });
                                updateUI();
                                saveWeddings();
                                alert('הגיבוי נטען בהצלחה וחתונות שעברו הוסרו!');
                            }
                        } else {
                            alert('קובץ הגיבוי אינו תקין.');
                        }
                    } catch (err) {
                        alert('שגיאה בקריאת הקובץ.');
                    }
                    importFileInput.value = '';
                };
                reader.readAsText(file);
            });

            // ==========================================

            searchInput.addEventListener('input', (e) => {
                renderWeddings(e.target.value.trim());
            });

            cancelEditBtn.addEventListener('click', cancelEdit);

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                const groomName = document.getElementById('groomName').value.trim();
                const committee = document.getElementById('committee').value.trim();
                const venueName = document.getElementById('venueName').value.trim();
                const address = document.getElementById('address').value.trim();
                const gregorianDate = gregorianDateInput.value;
                const hebrewDate = hebrewDateInput.value.trim();

                const weddingData = {
                    groomName,
                    committee,
                    venueName,
                    address,
                    gregorianDate,
                    hebrewDate
                };

                if (editId) {
                    const index = weddings.findIndex(w => w.id === editId);
                    if (index > -1) {
                        weddingData.id = editId;
                        weddings[index] = weddingData;
                    }
                    cancelEdit();
                } else {
                    weddingData.id = 'w_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
                    weddings.push(weddingData);
                    form.reset();
                }

                updateUI();
                saveWeddings();
                searchInput.value = '';
            });
        });
    </script>
</body>
</html>
